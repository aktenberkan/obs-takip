name: OBS Not Kontrol Botu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# The public code repository only needs read access.
# A separate fine-grained PAT is used to write to each user's PRIVATE state repo.
permissions:
  contents: read

jobs:
  check_grades:
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v7

      - name: Python Kur
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      # Each user creates their own PRIVATE repository for son_durum.txt.
      - name: Özel not deposunu çek
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.STATE_REPO }}
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: private-state

      - name: Önceki not durumunu özel depodan yükle
        shell: bash
        run: |
          # Never use a possibly tracked/old public copy as personal state.
          rm -f son_durum.txt
          if [[ -f private-state/son_durum.txt ]]; then
            cp private-state/son_durum.txt son_durum.txt
            echo "Önceki kişisel not kaydı yüklendi."
          else
            echo "Özel depoda henüz kayıt yok; ilk çalıştırmada başlangıç kaydı oluşturulacak."
          fi

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          OKUL_NO: ${{ secrets.OKUL_NO }}
          OKUL_SIFRE: ${{ secrets.OKUL_SIFRE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python grade_tracker.py

      - name: Not geçmişini özel depoya kaydet
        if: success()
        shell: bash
        run: |
          if [[ ! -s son_durum.txt ]]; then
            echo "HATA: son_durum.txt oluşturulmadı; özel depoya kayıt yapılmayacak."
            exit 1
          fi

          cp son_durum.txt private-state/son_durum.txt
          cd private-state
          git config user.name "OBS Not Takip Botu"
          git config user.email "actions@github.com"
          git add son_durum.txt

          if git diff --cached --quiet; then
            echo "Özel not deposunda kaydedilecek değişiklik yok."
          else
            git commit -m "Not durumu güncellendi"
            git push
          fi
