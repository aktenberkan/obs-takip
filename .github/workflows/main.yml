name: OBS Not Kontrol Botu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_grades:
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v7

      - name: Python Kur
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          OKUL_NO: ${{ secrets.OKUL_NO }}
          OKUL_SIFRE: ${{ secrets.OKUL_SIFRE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python grade_tracker.py

      - name: Değişiklik Varsa Kaydet (Commit & Push)
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'

          git add son_durum.txt

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "Notlar güncellendi"
            git push
          fi
